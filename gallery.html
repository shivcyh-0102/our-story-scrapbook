<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="A quiet gallery of our favorite captured moments." />
<meta name="theme-color" content="#FBF6F3" />
<title>Our Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF6F3;
    --ivory-deep:#F5EDE8;
    --ink:#3A2E2E;
    --ink-soft:#6E5D5D;
    --rose:#B8768A;
    --rose-deep:#9C5A6E;
    --blush:#EFE0E2;
    --gold:#C9A876;
    --line: rgba(58,46,46,0.12);
    --shadow: 0 1px 2px rgba(58,46,46,0.04), 0 8px 24px rgba(58,46,46,0.06);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  /* ---------- Nav ---------- */
  .navbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.1rem 1.5rem;
    background:rgba(251,246,243,0.82);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-bottom:1px solid var(--line);
    transition: transform .35s ease;
  }

  .navbar a{
    font-family:'Inter', sans-serif;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--ink-soft);
    text-decoration:none;
    padding:0.5rem 1rem;
    border-radius:999px;
    transition: color .25s ease, background .25s ease;
  }

  .navbar a:hover{
    color:var(--rose-deep);
    background:var(--blush);
  }

  /* ---------- Hero ---------- */
  header.gallery-hero{
    max-width:720px;
    margin:0 auto;
    padding:9.5rem 1.5rem 4rem;
    text-align:center;
  }

  .memory-stamp{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:1.1rem;
    position:relative;
  }

  .memory-stamp::before,
  .memory-stamp::after{
    content:"";
    display:inline-block;
    width:28px;
    height:1px;
    background:var(--gold);
    vertical-align:middle;
    margin:0 0.7em;
    opacity:.6;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.6rem, 6vw, 3.8rem);
    line-height:1.1;
    margin:0 0 0.9rem;
    color:var(--ink);
  }

  header.gallery-hero > p{
    font-size:1rem;
    font-weight:300;
    color:var(--ink-soft);
    line-height:1.7;
    margin:0 auto;
    max-width:38ch;
  }

  /* ---------- Gallery ---------- */
  .gallery{
    max-width:1180px;
    margin:0 auto;
    padding:0 1.5rem 6rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:2.6rem 1.9rem;
  }

  .photo-card{
    cursor:pointer;
    display:flex;
    flex-direction:column;
  }

  .photo-frame{
    position:relative;
    overflow:hidden;
    border-radius:6px;
    background:var(--ivory-deep);
    box-shadow:var(--shadow);
  }

  .photo-frame img{
    display:block;
    width:100%;
    height:340px;
    object-fit:cover;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }

  .photo-card:hover .photo-frame img{
    transform: scale(1.045);
  }

  .index-mark{
    position:absolute;
    top:0.85rem;
    left:0.85rem;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.85rem;
    color:var(--ivory);
    background:rgba(58,46,46,0.35);
    backdrop-filter: blur(4px);
    padding:0.2rem 0.6rem;
    border-radius:999px;
    letter-spacing:0.02em;
  }

  .caption{
    margin-top:0.9rem;
    padding-top:0.9rem;
    border-top:1px solid var(--line);
    font-family:'Cormorant Garamond', serif;
    font-size:1.08rem;
    font-weight:500;
    line-height:1.55;
    color:var(--ink);
  }

  .caption-tag{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose);
    margin-bottom:0.35rem;
  }

  /* ---------- Footer ---------- */
  footer{
    text-align:center;
    padding:3rem 1.5rem 4rem;
    color:var(--ink-soft);
    font-size:0.82rem;
    font-weight:300;
    letter-spacing:0.02em;
  }

  footer .heart{
    color:var(--rose);
  }

  /* ---------- Modal / Lightbox ---------- */
  .modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(30,22,22,0.92);
    align-items:center;
    justify-content:center;
    padding:2rem;
  }

  .modal-frame{
    margin:0;
    max-width:min(880px, 90vw);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .modal-content{
    display:block;
    max-width:100%;
    max-height:72vh;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }

  #modalCaption{
    margin-top:1.4rem;
    text-align:center;
    color:var(--ivory);
    font-family:'Cormorant Garamond', serif;
    font-size:1.2rem;
    font-style:italic;
    line-height:1.6;
    max-width:60ch;
  }

  .close{
    position:absolute;
    top:1.5rem;
    right:1.8rem;
    background:none;
    border:none;
    color:var(--ivory);
    font-size:2rem;
    font-weight:300;
    cursor:pointer;
    line-height:1;
    opacity:0.75;
    transition:opacity .2s ease;
  }
  .close:hover{opacity:1;}

  .modal-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:var(--ivory);
    font-size:1.6rem;
    width:48px;
    height:48px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .2s ease;
  }
  .modal-nav:hover{ background:rgba(255,255,255,0.18); }
  .modal-prev{ left:1.2rem; }
  .modal-next{ right:1.2rem; }

  @media (max-width: 640px){
    header.gallery-hero{ padding-top:7.5rem; }
    .gallery{ grid-template-columns:1fr; gap:2.4rem; }
    .modal-nav{ width:40px; height:40px; font-size:1.3rem; }
  }

  :focus-visible{
    outline:2px solid var(--rose);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body class="gallery-page">

  <div class="navbar" id="navbar">
    <a href="index.html">Back to Home</a>
  </div>

  <header class="gallery-hero">
    <span class="memory-stamp">Photo Archive</span>
    <h1>Our Memories</h1>
    <p>A quieter place to keep the moments that stayed with us.</p>
  </header>

  <div class="gallery" id="gallery"></div>

  <footer>
    i love you, ganda  <span class="heart">&#9825;</span>
  </footer>

  <div id="myModal" class="modal">
    <button class="close" type="button" onclick="closeModal()" aria-label="Close photo">&times;</button>
    <button class="modal-nav modal-prev" type="button" onclick="changePhoto(-1)" aria-label="Previous photo">&#8249;</button>
    <figure class="modal-frame">
      <img class="modal-content" id="img01" alt="Modal Image">
      <figcaption id="modalCaption"></figcaption>
    </figure>
    <button class="modal-nav modal-next" type="button" onclick="changePhoto(1)" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
   const photos = [
  { src: "una.jpg", alt: "", caption: "Our first photo booth together, taken on our first anniversary." },
  { src: "dos.jpg", alt: "", caption: "A sweet moment from the day I picked you up from school." },
  { src: "tres.jpg", alt: "", caption: "Another memorable moment from our first anniversary. One of my favorite photos of us, especially because you gave me a ring that day." },
  { src: "kwatro.jpg", alt: "", caption: "A photo from way back when we were in Grade 10. I still miss those simple moments we shared." },
  { src: "marikina.jpg", alt: "", caption: "A memorable moment together at Marikina River Banks, from the day I visited you in Marikina." },
  { src: "cute.jpg", alt: "", caption: "My first time visiting Marikina, and one of our first bonding moments together." },
  { src: "cute2.jpg", alt: "", caption: "A simple, candid moment that I really love. You looked so cute resting your head on my hand." },
  { src: "cute3.jpg", alt: "", caption: "One of our favorite little moments together, captured while doing one of those photo trends." },
  { src: "usbebe.jpg", alt: "", caption: "A day when we watched a movie together. Something small went wrong, but we still chose to enjoy the day. Looking back, the little problems never mattered as much as simply having each other." },
  { src: "bebe.jpg", alt: "", caption: "A photo from when we were in Grade 11, during one of our school events. I remember thinking you looked gorgeousthat day." },
  { src: "photo_2024-06-16_03-46-19.jpg", alt: "", caption: "Another one of our little eye-photo moments." },
  { src: "mamaw.jpg", alt: "", caption: "One of my favorite photos of you." },
  { src: "g10.jpg", alt: "", caption: "The first time I treated you to something a small moment, but one I still remember." }
];

    const galleryEl = document.getElementById("gallery");

    function pad(n){ return String(n + 1).padStart(2, "0"); }

    photos.forEach((photo, i) => {
      const card = document.createElement("div");
      card.className = "photo-card";
      card.setAttribute("tabindex", "0");
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Open photo: " + photo.alt);

      card.innerHTML = `
        <div class="photo-frame">
          <span class="index-mark">${pad(i)}</span>
          <img src="${photo.src}" alt="${photo.alt}" loading="lazy" decoding="async">
        </div>
        <div class="caption">
          <span class="caption-tag">${photo.alt}</span>
          ${photo.caption}
        </div>
      `;

      card.addEventListener("click", () => openModal(i));
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(i); }
      });

      galleryEl.appendChild(card);
    });

    let activePhotoIndex = 0;

    function renderModalPhoto() {
      const modalImg = document.getElementById("img01");
      const modalCaption = document.getElementById("modalCaption");
      const photo = photos[activePhotoIndex];
      modalImg.src = photo.src;
      modalImg.alt = photo.alt;
      modalCaption.textContent = photo.caption;
    }

    function openModal(index) {
      const modal = document.getElementById("myModal");
      activePhotoIndex = index;
      renderModalPhoto();
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function changePhoto(direction) {
      activePhotoIndex = (activePhotoIndex + direction + photos.length) % photos.length;
      renderModalPhoto();
    }

    function closeModal() {
      const modal = document.getElementById("myModal");
      modal.style.display = "none";
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", (event) => {
      const modal = document.getElementById("myModal");
      if (modal.style.display !== "flex") return;
      if (event.key === "Escape") closeModal();
      else if (event.key === "ArrowLeft") changePhoto(-1);
      else if (event.key === "ArrowRight") changePhoto(1);
    });

    document.getElementById("myModal").addEventListener("click", (e) => {
      if (e.target.id === "myModal") closeModal();
    });
  </script>

</body>
</html>
