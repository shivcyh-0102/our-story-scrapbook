<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A private notes archive for saved personal messages." />
  <meta name="theme-color" content="#fff1f4" />
  <title>Messages for You</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="polish.css">
</head>
<body class="messages-page">
  <div class="navbar">
    <a href="index.html" class="back-button">Back to Home</a>
  </div>

  <header class="messages-hero">
    <span class="memory-stamp">Private Notes</span>
    <h1>Messages for You</h1>
    <p>A quiet space for words I still want to leave behind.</p>
  </header>

  <main class="messages-layout">
    <section class="message-composer" aria-labelledby="composerTitle">
      <div class="composer-heading">
        <span class="section-label">Write</span>
        <h2 id="composerTitle">Leave a Message</h2>
        <p>These are the messages I want you to read someday.</p>
      </div>

      <form id="messageForm" class="message-form">
        <label for="messageText">Message</label>
        <textarea id="messageText" name="messageText" rows="8" placeholder="Write your message here..." maxlength="2000" required></textarea>

        <div class="form-error" id="formError" aria-live="polite"></div>

        <div class="composer-actions">
          <button class="submit-button" type="submit">Save Message</button>
          <button class="ghost-button" type="button" id="clearDraftButton">Clear Draft</button>
        </div>
      </form>
    </section>

    <section class="message-archive" aria-labelledby="archiveTitle">
      <div class="archive-heading">
        <span class="section-label">Archive</span>
        <h2 id="archiveTitle">Saved Messages</h2>
        <p id="messageCount">0 messages saved</p>
      </div>

      <div id="emptyState" class="empty-state">
        <strong>No messages yet.</strong>
        <span>Saved messages will appear here with the date and time.</span>
      </div>

      <div id="messagesList" class="messages-list" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhpykAVLzNnN087gU_-B960jrAc_InlJs",
  authDomain: "our-story-scrapbook.firebaseapp.com",
  projectId: "our-story-scrapbook",
  storageBucket: "our-story-scrapbook.firebasestorage.app",
  messagingSenderId: "207866832146",
  appId: "1:207866832146:web:e051d38d34c268f829ffcb",
  measurementId: "G-GNLVZ8195E"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

try {
  await signInWithEmailAndPassword(auth, "gapas644@gmail.com", "Pogiako2233");
} catch (error) {
  console.error("Auth error:", error);
}

const form = document.getElementById("messageForm");
const textarea = document.getElementById("messageText");
const list = document.getElementById("messagesList");
const emptyState = document.getElementById("emptyState");
const messageCount = document.getElementById("messageCount");
const clearDraftButton = document.getElementById("clearDraftButton");
const formError = document.getElementById("formError");
const submitButton = document.querySelector(".submit-button");

function autoResize() {
  textarea.style.height = "auto";
  textarea.style.height = Math.min(textarea.scrollHeight, 400) + "px";
}

textarea.addEventListener("input", () => {
  autoResize();
  if (formError.textContent) formError.textContent = "";
});

function toDateObj(dateValue) {
  if (!dateValue) return null;
  if (dateValue.toDate) return dateValue.toDate();
  const date = new Date(dateValue);
  return isNaN(date.getTime()) ? null : date;
}

function formatStamp(dateValue) {
  const date = toDateObj(dateValue);
  if (!date) return "Unknown date";
  return new Intl.DateTimeFormat("en-PH", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(date);
}

function updateCount(messages) {
  const count = messages.length;
  messageCount.textContent =
    count === 1
      ? "1 message saved"
      : `${count} messages saved`;
  emptyState.hidden = count > 0;
}

function createMessageCard(message, index) {
  const article = document.createElement("article");
  article.className = "saved-message";

  const meta = document.createElement("div");
  meta.className = "message-meta";

  const number = document.createElement("span");
  number.textContent = `Note ${String(index + 1).padStart(2, "0")}`;

  const time = document.createElement("time");
  const dateObj = toDateObj(message.createdAt);
  time.dateTime = dateObj ? dateObj.toISOString() : "";
  time.textContent = formatStamp(message.createdAt);

  const content = document.createElement("p");
  content.textContent = message.text;

  const deleteButton = document.createElement("button");
  deleteButton.className = "delete-message";
  deleteButton.type = "button";
  deleteButton.textContent = "Delete";

  deleteButton.addEventListener("click", async () => {
    if (!confirm("Delete this message permanently?")) return;
    deleteButton.disabled = true;
    deleteButton.textContent = "Deleting...";
    try {
      await deleteDoc(doc(db, "messages", message.id));
    } catch (error) {
      console.error("Delete error:", error);
      alert("Failed to delete message. Please try again.");
      deleteButton.disabled = false;
      deleteButton.textContent = "Delete";
    }
  });

  meta.append(number, time);
  article.append(meta, content, deleteButton);
  return article;
}

const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));

onSnapshot(q, (snapshot) => {
  const messages = [];
  list.innerHTML = "";
  snapshot.forEach((documentData, index) => {
    const data = documentData.data();
    const message = { id: documentData.id, ...data };
    messages.push(message);
    list.appendChild(createMessageCard(message, index));
  });
  updateCount(messages);
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = textarea.value.trim();

  if (!text) {
    formError.textContent = "Please write a message before saving.";
    textarea.focus();
    return;
  }

  if (text.length < 2) {
    formError.textContent = "Message must be at least 2 characters.";
    textarea.focus();
    return;
  }

  formError.textContent = "";
  submitButton.disabled = true;
  submitButton.textContent = "Saving...";

  try {
    await addDoc(collection(db, "messages"), {
      text,
      createdAt: new Date().toISOString()
    });
    textarea.value = "";
    textarea.style.height = "auto";
  } catch (error) {
    console.error("Save error:", error);
    formError.textContent = "Failed to save message. Please try again.";
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Save Message";
    textarea.focus();
  }
});

clearDraftButton.addEventListener("click", () => {
  textarea.value = "";
  textarea.style.height = "auto";
  formError.textContent = "";
  textarea.focus();
});

</script>
  <script src="polish.js"></script>
</body>
</html>
