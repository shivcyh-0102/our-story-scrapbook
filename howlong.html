<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="A paused relationship timeline from December 20, 2023 to April 14, 2026." />
<meta name="theme-color" content="#FBF6F3" />
<title>Our Time Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF6F3;
    --ivory-deep:#F5EDE8;
    --ink:#3A2E2E;
    --ink-soft:#6E5D5D;
    --rose:#B8768A;
    --rose-deep:#9C5A6E;
    --blush:#EFE0E2;
    --gold:#C9A876;
    --line: rgba(58,46,46,0.12);
    --shadow: 0 1px 2px rgba(58,46,46,0.04), 0 8px 24px rgba(58,46,46,0.06);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ivory);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  a{color:inherit;}

  /* ---------- Ambient blobs (glass shows these through) ---------- */
  .ambient-blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    z-index:0;
    pointer-events:none;
    opacity:0.55;
  }

  .ambient-blob.one{
    width:380px; height:380px;
    top:-8%; left:-10%;
    background:radial-gradient(circle at 30% 30%, var(--rose) 0%, transparent 70%);
    animation: drift1 22s ease-in-out infinite;
  }

  .ambient-blob.two{
    width:320px; height:320px;
    top:38%; right:-12%;
    background:radial-gradient(circle at 60% 40%, var(--gold) 0%, transparent 70%);
    animation: drift2 26s ease-in-out infinite;
  }

  .ambient-blob.three{
    width:300px; height:300px;
    bottom:-10%; left:20%;
    background:radial-gradient(circle at 50% 50%, var(--rose-deep) 0%, transparent 70%);
    animation: drift3 30s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(30px,40px) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-35px,25px) scale(1.05); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-30px) scale(1.1); }
  }

  /* ---------- Nav ---------- */
  .navbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.1rem 1.5rem;
    background:rgba(251,246,243,0.82);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-bottom:1px solid var(--line);
  }

  .navbar a{
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--ink-soft);
    text-decoration:none;
    padding:0.5rem 1rem;
    border-radius:999px;
    transition: color .25s ease, background .25s ease;
  }

  .navbar a:hover{
    color:var(--rose-deep);
    background:var(--blush);
  }

  /* ---------- Hero ---------- */
  header.timeline-hero{
    max-width:640px;
    margin:0 auto;
    padding:9.5rem 1.5rem 3.5rem;
    text-align:center;
  }

  .memory-stamp{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:1.1rem;
  }

  .memory-stamp::before,
  .memory-stamp::after{
    content:"";
    display:inline-block;
    width:24px;
    height:1px;
    background:var(--gold);
    vertical-align:middle;
    margin:0 0.6em;
    opacity:.6;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.6rem, 6vw, 3.8rem);
    line-height:1.1;
    margin:0 0 0.9rem;
    color:var(--ink);
  }

  header.timeline-hero > p{
    font-size:1rem;
    font-weight:300;
    color:var(--ink-soft);
    max-width:42ch;
    margin:0 auto;
  }

  /* ---------- Layout ---------- */
  .timeline-layout{
    position:relative;
    z-index:1;
    max-width:560px;
    margin:0 auto;
    padding:0 1.5rem 6rem;
  }

  /* ---------- Liquid glass ---------- */
  .glass{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.16));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border-radius:26px;
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.6) inset,
      0 -12px 24px rgba(255,255,255,0.15) inset,
      0 12px 36px rgba(58,46,46,0.10);
    overflow:hidden;
  }

  .glass::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(115deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,0.3) 100%);
    pointer-events:none;
    mix-blend-mode:overlay;
  }

  .glass::after{
    content:"";
    position:absolute;
    top:-40%;
    left:-20%;
    width:60%;
    height:180%;
    background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    transform:rotate(8deg);
    pointer-events:none;
    animation: sheen 9s ease-in-out infinite;
  }

  @keyframes sheen{
    0%,100%{ left:-30%; opacity:0.5; }
    50%{ left:110%; opacity:0.75; }
  }

  /* ---------- Counter card ---------- */
  .counter-card{
    padding:2.4rem 2rem;
    text-align:center;
    margin-bottom:1.6rem;
    transition: box-shadow .35s ease, transform .35s ease;
  }

  .counter-card:hover{
    transform: translateY(-3px);
    box-shadow:
      0 1px 1px rgba(255,255,255,0.65) inset,
      0 -12px 24px rgba(255,255,255,0.18) inset,
      0 18px 44px rgba(58,46,46,0.14);
  }

  .glass > *{
    position:relative;
    z-index:1;
  }

  .counter-label{
    display:block;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:600;
    margin-bottom:1.1rem;
  }

  .counter-card .breakdown{
    font-family:'Cormorant Garamond', serif;
    font-size:1.5rem;
    color:var(--ink);
    line-height:1.5;
    margin:0 0 1rem;
  }

  .counter-card .breakdown strong{
    font-style:italic;
    color:var(--rose-deep);
  }

  .counter-card .total-days{
    font-size:0.92rem;
    font-weight:300;
    color:var(--ink-soft);
    padding-top:1rem;
    border-top:1px solid var(--line);
  }

  .counter-card .total-days strong{
    font-weight:600;
    color:var(--ink);
  }

  /* ---------- Dates card ---------- */
  .dates-card{
    padding:1.8rem 2rem;
    text-align:center;
    margin-bottom:1.6rem;
  }

  .dates-card p{
    margin:0.4rem 0;
    font-size:0.94rem;
    color:var(--ink-soft);
    font-weight:300;
  }

  .dates-card strong{
    color:var(--ink);
    font-weight:500;
  }

  /* ---------- Paused note ---------- */
  .paused-note{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.1rem;
    color:var(--rose-deep);
    margin:2rem 0 0;
  }

  footer{
    text-align:center;
    padding:3rem 1.5rem 4rem;
    color:var(--ink-soft);
    font-size:0.82rem;
    font-weight:300;
  }

  footer .heart{
    color:var(--rose);
  }

  @media (max-width: 640px){
    header.timeline-hero{ padding-top:7.5rem; }
    .counter-card{ padding:2rem 1.4rem; }
    .dates-card{ padding:1.5rem 1.4rem; }
    .ambient-blob{ opacity:0.4; }
  }

  :focus-visible{
    outline:2px solid var(--rose);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body class="timeline-page">

  <div class="ambient-blob one"></div>
  <div class="ambient-blob two"></div>
  <div class="ambient-blob three"></div>

  <div class="navbar">
    <a href="index.html">Back to Home</a>
  </div>

  <header class="timeline-hero">
    <span class="memory-stamp">Time Together</span>
    <h1>Our Time Together</h1>
    <p>The timer is now paused at the day the relationship ended, April 14, 2026.</p>
  </header>

  <main class="timeline-layout">
    <section class="glass counter-card" aria-label="Time together breakdown">
      <span class="counter-label">We Were Together For</span>
      <p class="breakdown" id="counter">Loading the memory&hellip;</p>
      <p class="total-days" id="totalDays"></p>
    </section>

    <section class="glass dates-card" aria-label="Start and end dates">
      <p>Started on <strong>December 20, 2023</strong></p>
      <p>Ended on <strong>April 14, 2026</strong></p>
    </section>

    <p class="paused-note">846 days. Every single one, kept.</p>
  </main>

  <footer>
    i love you, ganda <span class="heart">&#9825;</span>
  </footer>

  <script>
    const counterEl = document.getElementById('counter');
    const totalDaysEl = document.getElementById('totalDays');
    const startDate = new Date('2023-12-20T00:00:00');
    const endDate = new Date('2026-04-14T00:00:00');

    function diffYMD(start, end) {
      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      if (days < 0) {
        months -=  1;
        const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      return { years, months, days };
    }

    function updateCounter() {
      const { years, months, days } = diffYMD(startDate, endDate);
      const totalDays = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24));

      counterEl.innerHTML = `
        <strong>${years}</strong> year${years === 1 ? '' : 's'},
        <strong>${months}</strong> month${months === 1 ? '' : 's'},
        and <strong>${days}</strong> day${days === 1 ? '' : 's'}
      `;

      totalDaysEl.innerHTML = `That is <strong>${totalDays}</strong> days of shared memories.`;
    }

    updateCounter();
  </script>
  <script src="polish.js"></script>
</body>
</html>
